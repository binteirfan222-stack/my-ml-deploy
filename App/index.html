<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Model Deployment</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f7; display: flex; justify-content: center; padding: 40px 16px; }
    .container { background: white; padding: 24px 32px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 400px; width: 100%; }
    label { display: block; margin-top: 12px; margin-bottom: 4px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { margin-top: 20px; width: 100%; padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    #result { margin-top: 16px; font-size: 18px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Model Prediction</h1>
    <label>Feature 1</label>
    <input type="number" id="feature1" value="0" />
    <label>Feature 2</label>
    <input type="number" id="feature2" value="0" />
    <label>Feature 3</label>
    <select id="feature3">
      <option value="0">A</option>
      <option value="1">B</option>
      <option value="2">C</option>
    </select>
    <button id="predictBtn">Predict</button>
    <div id="result"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>
  <script>
    ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/";
    ort.env.wasm.numThreads = 1;

    let session = null;

    async function loadModel() {
      try {
        session = await ort.InferenceSession.create("./model.onnx");
        console.log("Model loaded successfully");
      } catch (err) {
        document.getElementById("result").innerText = "Error loading model: " + err.message;
      }
    }

    async function predict() {
      if (!session) {
        document.getElementById("result").innerText = "Model not loaded yet.";
        return;
      }
      const f1 = parseFloat(document.getElementById("feature1").value);
      const f2 = parseFloat(document.getElementById("feature2").value);
      const f3 = parseFloat(document.getElementById("feature3").value);

      const inputTensor = new ort.Tensor("float32", Float32Array.from([f1, f2, f3]), [1, 3]);
      const feeds = { [session.inputNames[0]]: inputTensor };
      const results = await session.run(feeds);
      const output = results[session.outputNames[0]];
      document.getElementById("result").innerText = "Prediction: " + output.data[0];
    }

    document.getElementById("predictBtn").addEventListener("click", predict);
    loadModel();
  </script>
</body>
</html>
